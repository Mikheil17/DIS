<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | Dungeon Deals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/logo-square.png" />
</head>

<body>

  <div class="container text-center py-5">
    <div class="order-success-container">

      <div class="success-icon">
        <i class="bi bi-check-lg"></i>
      </div>

      <h1>Thank You for Your Order!</h1>

      <p class="success-message">
        Your order has been successfully submitted.
        We appreciate your business!
      </p>

      <p class="order-number">
        Order number: <strong id="order-number"></strong>
      </p>

      
      <a href="shop.html" class="btn btn-warning mt-3">
        CONTINUE SHOPPING
      </a>

    </div>
  </div>

  <script>
    const orderNumber = sessionStorage.getItem("lastOrderNumber");

    document.getElementById("order-number").textContent =
      orderNumber || "DD-DEMO";
  </script>

</body>
</html>
